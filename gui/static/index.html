<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MornKanban</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="app-header">
  <h1>MornKanban</h1>
  <div id="dep-badges"></div>
</header>

<section id="project-row">
  <select id="project-list"></select>
  <input id="project-path" type="text" placeholder="プロジェクトの絶対パス">
  <button id="btn-add-project">追加</button>
  <button id="btn-init">kanban init</button>
</section>

<section id="action-row">
  <button id="btn-secretary">秘書を起動</button>
  <input id="jobs-input" type="number" value="2" min="1" max="8">
  <button id="btn-dispatch">ディスパッチャ起動</button>
</section>

<nav id="tabs">
  <button id="tab-board">ボード</button>
  <button id="tab-policy">ポリシー</button>
</nav>

<section id="view-board">
  <div id="board">
    <div class="column" data-status="todo">
      <h2>todo</h2>
      <ul id="col-todo" class="card-list"></ul>
    </div>
    <div class="column" data-status="doing">
      <h2>doing</h2>
      <ul id="col-doing" class="card-list"></ul>
    </div>
    <div class="column" data-status="review">
      <h2>review</h2>
      <ul id="col-review" class="card-list"></ul>
    </div>
    <div class="column" data-status="done">
      <h2>done</h2>
      <ul id="col-done" class="card-list"></ul>
    </div>
    <div class="column" data-status="failed">
      <h2>failed</h2>
      <ul id="col-failed" class="card-list"></ul>
    </div>
  </div>

  <form id="card-form">
    <input id="card-title" type="text" placeholder="タイトル">
    <textarea id="card-body" rows="6" placeholder="本文"></textarea>
    <select id="card-backend">
      <option value="">空=auto既定</option>
      <option value="claude">claude</option>
      <option value="codex">codex</option>
    </select>
    <input id="card-model" type="text" placeholder="model (空=既定)">
    <button id="btn-add-card" type="button">カード追加</button>
  </form>
</section>

<section id="view-policy" hidden>
  <textarea id="policy-editor"></textarea>
  <button id="btn-save-policy">保存</button>
</section>

<div id="card-modal" hidden>
  <div class="modal-box">
    <button id="modal-close">×</button>
    <pre id="modal-content"></pre>
  </div>
</div>

<div id="toast" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
