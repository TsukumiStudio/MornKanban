<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MornKanban Setup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="app-header">
  <h1>MornKanban Setup</h1>
  <div id="dep-badges"></div>
</header>

<main id="setup-steps">
  <section id="step-cli" class="step-card">
    <h2>1. kanban CLI</h2>
    <p>kanban コマンドをインストールします。 <span id="install-cli-status"></span></p>
    <button id="btn-install-cli">kanban CLI をインストール</button>
  </section>

  <section id="step-skill" class="step-card">
    <h2>2. Claude Code スキル</h2>
    <p>kanban-dispatch スキルを導入します。 <span id="install-skill-status"></span></p>
    <button id="btn-install-skill">Claude Code スキルを導入</button>
  </section>

  <section id="step-projects" class="step-card">
    <h2>3. プロジェクト</h2>
    <div class="row">
      <input id="project-path" type="text" placeholder="プロジェクトの絶対パス">
      <button id="btn-add-project">追加</button>
    </div>
    <ul id="project-list"></ul>
  </section>

  <section id="step-next" class="step-card">
    <h2>4. 使い方</h2>
    <p>導入後は Herdr のペインで claude を起動し「kanban の秘書として待機して」と一言送るだけです。</p>
  </section>
</main>

<div id="toast" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
